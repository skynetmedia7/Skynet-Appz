name: Build Skynet APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/skynet-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SKYNET_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/skynet-release.jks"
      - name: Build signed release APK
        env:
          SKYNET_KEYSTORE_PATH: ${{ runner.temp }}/skynet-release.jks
          SKYNET_KEYSTORE_PASSWORD: ${{ secrets.SKYNET_KEYSTORE_PASSWORD }}
          SKYNET_KEY_ALIAS: ${{ secrets.SKYNET_KEY_ALIAS }}
          SKYNET_KEY_PASSWORD: ${{ secrets.SKYNET_KEY_PASSWORD }}
        run: gradle -p android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Skynet-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

# Signed release build so future APKs can update the installed Skynet app.
